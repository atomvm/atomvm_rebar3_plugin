name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macports_use_cache:
        description: 'Use cached macports'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  macports_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.macports_use_cache }} || true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-26.04", "ubuntu-26.04-arm", "macos-26", "macos-15-intel"]
        otp: ["27", "28", "29"]
        include:
          - otp: "27"
            make_jobs: "all"
            rebar3_version: "3.27.3"
          - otp: "28"
            make_jobs: "all"
            rebar3_version: "3.27.3"
          - otp: "29"
            make_jobs: "all"
            rebar3_version: "3.28.0"
        exclude:
          - otp: "27"
            os: "macos-15-intel"
          - otp: "28"
            os: "macos-15-intel"

    steps:
    - name: "Validate MacPorts cache input on dispatch"
      if: ${{ matrix.os == 'macos-15-intel' && github.event_name == 'workflow_dispatch' }}
      run: |
        case "$macports_cache" in
          true|false) ;;
          *) echo "Invalid MacPorts cache input: $macports_cache" >&2; exit 1 ;;
        esac

    - name: "Install MacPorts deps"
      if: matrix.os == 'macos-15-intel'
      uses: ukiryu/setup-macports@v1
      with:
        install-ports: 'gperf ninja llvm-20 erlang rebar3'
        cache: ${{ env.macports_cache }}

    - name: "Setup MacPorts Python"
      if: matrix.os == 'macos-15-intel'
      run: |
        sudo port select --set python python314
        sudo port select --set python3 python314

    - name: "Install Homebrew deps"
      if: startsWith(matrix.os, 'macos-') && matrix.os != 'macos-15-intel'
      run: |
        brew update && HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install gperf ninja llvm erlang@${{ matrix.otp }} rebar3
        echo PATH="/usr/local/opt/llvm/bin:/opt/homebrew/opt/llvm/bin:$PATH" >> $GITHUB_ENV

    - name: "Install Ubintu deps"
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt install -y make git gcc-14 g++-14 cmake gperf zlib1g-dev libmbedtls-dev ninja-build

    # Setup OTP
    - name: "Setup OTP"
      if: startsWith(matrix.os, 'ubuntu-')
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        rebar3-version: ${{ matrix.rebar3_version }}

    # Builder info
    - name: "System info"
      run: |
        echo "**uname:**"
        uname -a
        echo "**OTP version:**"
        cat $(dirname $(which erlc))/../releases/RELEASES || true

    # Checkout AtomVM
    - name: "Checkout AtomVM"
      uses: actions/checkout@v5
      with:
        repository: 'atomvm/AtomVM'
        path: 'atomvm'
        submodules: 'recursive'

    - name: "Install AtomVM"
      working-directory: 'atomvm'
      run: |
        mkdir build
        cd build
        cmake -DAVM_BUILD_RUNTIME_ONLY=ON -G Ninja ..
        cmake --build .
        sudo cmake --build . -t install
        atomvm -v

    # Setup
    - name: "Checkout repo"
      uses: actions/checkout@v5
      with:
        path: 'atomvm_packbeam'
        submodules: 'recursive'

    # Build
    - name: "Make"
      working-directory: 'atomvm_packbeam'
      run: PATH="/tmp/rebar3:${PATH}" make ${{ matrix.make_jobs }}
